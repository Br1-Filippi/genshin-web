# Configuración del análisis de SonarQube.
# El projectKey/projectName se define en cada job de Jenkins
# (genshin_web_dev / genshin_web_prod) en "Analysis properties".
sonar.projectKey=genshin-web
sonar.projectName=genshin-web
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.coverage.exclusions=src/main.tsx,src/types.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Espera el resultado del Quality Gate: si falla, el scanner termina con error
# y Jenkins detiene el job antes del despliegue.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
